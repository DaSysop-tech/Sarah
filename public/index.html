<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sarah — Your Gaming Companion</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <section class="stage companion-visual" id="stage" data-mood="happy">
      <div class="aura"></div>
      <div class="particle-layer" id="particleLayer"></div>
      <img class="companion-photo" src="assets/sarah_anthro.jpg" alt="Sarah" title="Say hi!" />
      <div class="waveform" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <div class="stage-top">
        <span class="status-pulse" id="statusPulse"></span>
        <span class="status-text" id="statusText">online · here for you</span>
      </div>
      <div class="stage-caption-wrap">
        <p class="stage-caption" id="stageCaption">&nbsp;</p>
      </div>
    </section>

    <aside class="side-panel">
      <div class="side-header">
        <h1>Sarah</h1>
        <button id="callBtn" class="call-btn">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.01-.24 11.36 11.36 0 0 0 3.58.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1 11.36 11.36 0 0 0 .57 3.58 1 1 0 0 1-.25 1.01l-2.2 2.2z"/></svg>
          Call Sarah
        </button>
      </div>

      <div class="style-toggle" id="styleToggle">
        <button class="style-btn" data-style="human" type="button">Human</button>
        <button class="style-btn active" data-style="anthro" type="button">Anthro</button>
      </div>

      <div class="game-context">
        <label for="gameInput">What are we playing?</label>
        <input id="gameInput" type="text" placeholder="e.g. Valorant, Elden Ring..." autocomplete="off" />
      </div>

      <div class="quick-actions">
        <p class="quick-label">Quick reactions</p>
        <div class="quick-grid">
          <button class="quick-btn" data-msg="We just won! I'm so hyped right now!">🏆 We won!</button>
          <button class="quick-btn" data-msg="Ugh, I just died. That run is over.">💀 I died</button>
          <button class="quick-btn" data-msg="This boss is destroying me, I need encouragement.">🔥 Send help</button>
          <button class="quick-btn" data-msg="I'm heading out for now, talk soon.">👋 Gotta go</button>
        </div>
      </div>

      <div class="chat-log" id="chatLog"></div>

      <div class="composer">
        <button id="micBtn" class="mic-btn" title="Push to talk / toggle voice chat" aria-label="Toggle voice chat">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/>
          </svg>
        </button>
        <input id="textInput" type="text" placeholder="Say something to Sarah..." autocomplete="off" />
        <button id="sendBtn" class="send-btn">Send</button>
      </div>
      <p class="hint" id="hint">Tap the mic to talk hands-free, or tap her photo to say hi.</p>

      <div class="settings">
        <label class="toggle-row">
          <input type="checkbox" id="voiceOutToggle" checked />
          <span>Speak replies out loud</span>
        </label>
        <p class="voice-status" id="voiceStatus">
          <span class="voice-status-dot"></span>
          <span id="voiceStatusText">Checking voice engine…</span>
        </p>
        <button id="resetBtn" class="ghost-btn">Reset conversation</button>
      </div>
    </aside>
  </div>

  <div class="call-overlay" id="callOverlay" hidden>
    <div class="call-stage companion-visual" id="callStage" data-mood="happy">
      <div class="aura"></div>
      <div class="particle-layer" id="callParticleLayer"></div>
      <img class="companion-photo" src="assets/sarah_anthro.jpg" alt="Sarah" />
      <div class="waveform" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>
    <p class="call-status" id="callStatusText">Calling Sarah…</p>
    <p class="call-caption" id="callCaption">&nbsp;</p>
    <div class="call-controls">
      <button id="callMuteBtn" class="call-icon-btn" title="Mute microphone">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
      </button>
      <button id="endCallBtn" class="end-call-btn">End Call</button>
    </div>
    <div class="call-text-fallback">
      <input id="callTextInput" type="text" placeholder="No mic? Type to Sarah during the call..." autocomplete="off" />
      <button id="callSendBtn" class="send-btn">Send</button>
    </div>
  </div>

  <audio id="ttsAudio" hidden crossorigin="anonymous"></audio>
  <script src="app.js"></script>
</body>
</html>
